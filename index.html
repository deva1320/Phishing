<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduLearn University Portal</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="warning">
⚠ Educational Demonstration – Phishing Awareness Simulation.
Never enter real usernames or passwords.
</div>

<div class="container">

<div class="left">

<h1>EduLearn University</h1>

<p>
Student Information Management System
</p>

<ul>
<li>Academic Records</li>
<li>Attendance</li>
<li>Exam Results</li>
<li>Course Registration</li>
<li>Fee Details</li>
</ul>

</div>

<div class="right">

<div class="login-box">

<h2>Student Login</h2>

<form id="loginForm">

<input
type="text"
placeholder="Username"
required
id="username">

<input
type="password"
placeholder="Password"
required
id="password">

<label>

<input type="checkbox">

Remember Me

</label>

<button type="submit">
Login
</button>

<a href="#">
Forgot Password?
</a>

</form>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
